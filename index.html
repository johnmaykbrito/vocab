<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards — Vocabulário</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Georgia, "Times New Roman", serif;
        background: #f5f3ee;
        color: #1a1a18;
        min-height: 100vh;
        padding: 3rem 1.5rem;
      }

      h1 {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 0.04em;
        color: #3a3a38;
        margin-bottom: 0.4rem;
      }

      .subtitle {
        text-align: center;
        font-size: 0.85rem;
        color: #888780;
        margin-bottom: 1.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .lang-switcher {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 1rem;
      }

      .lang-btn {
        font-family: "Courier New", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 5px 16px;
        border-radius: 99px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: transparent;
        color: #888780;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        border-color: rgba(0, 0, 0, 0.3);
        color: #3a3a38;
      }

      .lang-btn.active {
        background: #1a1a18;
        color: #f5f3ee;
        border-color: #1a1a18;
      }

      .quiz-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-bottom: 3rem;
      }

      .quiz-btn {
        font-family: "Courier New", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 5px 16px;
        border-radius: 99px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: transparent;
        color: #888780;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .quiz-btn:hover {
        border-color: rgba(0, 0, 0, 0.3);
        color: #3a3a38;
      }

      .quiz-btn.active {
        background: #888780;
        color: #f5f3ee;
        border-color: #888780;
      }

      .quiz-btn#btn-all.active {
        background: #1a1a18;
        color: #f5f3ee;
        border-color: #1a1a18;
      }

      .quiz-size-input {
        font-family: "Courier New", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        width: 44px;
        text-align: center;
        padding: 5px 6px;
        border-radius: 99px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: transparent;
        color: #888780;
        outline: none;
        transition: all 0.2s ease;
        -moz-appearance: textfield;
      }

      .quiz-size-input::-webkit-outer-spin-button,
      .quiz-size-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
      }

      .quiz-size-input:focus {
        border-color: rgba(0, 0, 0, 0.35);
        color: #3a3a38;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
      }

      .card-wrap {
        perspective: 900px;
        height: 210px;
        cursor: pointer;
      }

      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card-wrap:hover .card:not(.flipped) {
        transform: rotateY(6deg);
      }
      .card.flipped {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.4rem;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      .front {
        background: #ffffff;
      }
      .back {
        background: #f0ede6;
        transform: rotateY(180deg);
      }

      .nivel {
        font-family: "Courier New", monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 12px;
        padding: 3px 10px;
        border-radius: 99px;
        font-weight: 700;
      }

      .palavra {
        font-size: 24px;
        font-weight: 400;
        color: #1a1a18;
        text-align: center;
        font-style: italic;
      }

      .nivel-back {
        font-family: "Courier New", monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .definicao {
        font-size: 13px;
        color: #444441;
        text-align: center;
        line-height: 1.65;
      }

      .n1 .nivel {
        background: #e1f5ee;
        color: #0f6e56;
      }
      .n1 .nivel-back {
        color: #0f6e56;
      }
      .n2 .nivel {
        background: #e6f1fb;
        color: #185fa5;
      }
      .n2 .nivel-back {
        color: #185fa5;
      }
      .n3 .nivel {
        background: #faeeda;
        color: #854f0b;
      }
      .n3 .nivel-back {
        color: #854f0b;
      }
      .n4 .nivel {
        background: #eeedfe;
        color: #534ab7;
      }
      .n4 .nivel-back {
        color: #534ab7;
      }
      .n5 .nivel {
        background: #faece7;
        color: #993c1d;
      }
      .n5 .nivel-back {
        color: #993c1d;
      }
      .n6 .nivel {
        background: #ebebeb;
        color: #5f5e5a;
      }
      .n6 .nivel-back {
        color: #5f5e5a;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1e1c;
          color: #e8e6e0;
        }
        h1 {
          color: #c8c6c0;
        }
        .front {
          background: #2a2a28;
        }
        .back {
          background: #242422;
        }
        .face {
          border-color: rgba(255, 255, 255, 0.07);
        }
        .palavra {
          color: #e8e6e0;
        }
        .definicao {
          color: #b4b2a9;
        }

        .lang-btn {
          border-color: rgba(255, 255, 255, 0.15);
          color: #888780;
        }
        .lang-btn:hover {
          border-color: rgba(255, 255, 255, 0.35);
          color: #c8c6c0;
        }
        .lang-btn.active {
          background: #e8e6e0;
          color: #1a1a18;
          border-color: #e8e6e0;
        }

        .quiz-btn {
          border-color: rgba(255, 255, 255, 0.15);
          color: #888780;
        }
        .quiz-btn:hover {
          border-color: rgba(255, 255, 255, 0.35);
          color: #c8c6c0;
        }
        .quiz-btn.active {
          background: #888780;
          color: #1a1a18;
          border-color: #888780;
        }
        .quiz-btn#btn-all.active {
          background: #e8e6e0;
          color: #1a1a18;
          border-color: #e8e6e0;
        }

        .quiz-size-input {
          border-color: rgba(255, 255, 255, 0.15);
          color: #888780;
        }
        .quiz-size-input:focus {
          border-color: rgba(255, 255, 255, 0.35);
          color: #c8c6c0;
        }

        .n1 .nivel {
          background: #085041;
          color: #9fe1cb;
        }
        .n1 .nivel-back {
          color: #9fe1cb;
        }
        .n2 .nivel {
          background: #0c447c;
          color: #b5d4f4;
        }
        .n2 .nivel-back {
          color: #b5d4f4;
        }
        .n3 .nivel {
          background: #633806;
          color: #fac775;
        }
        .n3 .nivel-back {
          color: #fac775;
        }
        .n4 .nivel {
          background: #3c3489;
          color: #cecbf6;
        }
        .n4 .nivel-back {
          color: #cecbf6;
        }
        .n5 .nivel {
          background: #712b13;
          color: #f5c4b3;
        }
        .n5 .nivel-back {
          color: #f5c4b3;
        }
        .n6 .nivel {
          background: #333331;
          color: #d3d1c7;
        }
        .n6 .nivel-back {
          color: #d3d1c7;
        }
      }
    </style>
  </head>
  <body>
    <h1>Flashcards de Vocabulário</h1>
    <p class="subtitle" id="subtitle">
      Português Brasileiro · por frequência de exposição
    </p>

    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('pt')">PT</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('fr')">FR</button>
    </div>

    <div class="quiz-controls">
      <button class="quiz-btn active" id="btn-all" onclick="setMode('all')">
        Todos
      </button>
      <button class="quiz-btn" id="btn-quiz" onclick="setMode('quiz')">
        Sortear
      </button>
      <input
        type="number"
        id="quiz-size-input"
        class="quiz-size-input"
        min="1"
        value="3"
        title="Quantidade de cards sorteados"
      />
      <button class="quiz-btn" id="btn-play" onclick="openPlay()">
        ▶ Play
      </button>
    </div>

    <div class="grid" id="cards"></div>

    <script>
      /* ─── CONFIGURAÇÃO ─────────────────────────────────────────────────────
       QUIZ_SIZE define o valor inicial do sorteio.
       Pode ser alterado aqui ou diretamente pelo campo numérico na tela.
    ─────────────────────────────────────────────────────────────────────── */
      let QUIZ_SIZE = 3;

      /* ─── DADOS ────────────────────────────────────────────────────────────
       Adicione palavras livremente em cada lista.
       Cada entrada: { nivel, classe (n1–n6), palavra, definicao }
       As listas são independentes — não são traduções entre si.
    ─────────────────────────────────────────────────────────────────────── */
      const db = {
        pt: [
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "modorra",
            definicao:
              "Sonolência pesada, letargia ou apatia provocada por calor ou doença. Embora precisa, é uma palavra de uso predominantemente literário e formal.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "desincumbir",
            definicao:
              "Desobrigar-se de um dever, tarefa ou encargo; cumpri uma obrigação. Palavra comum em contratos, correspondências profissionais e textos jornalísticos.",
          },
          {
            nivel: "Cotidiana",
            classe: "n2",
            palavra: "greta",
            definicao:
              "Fenda estreita, rachadura ou abertura em uma superfície (como terra ou parede). Palavra do vocabulário cotidiano de uso prático e direto.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "garbo",
            definicao:
              "Elegância na postura, no porte ou no comportamento; graça ou distinção. Embora muito compreendida, é uma palavra de uso predominantemente formal e literário.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "imbróglio",
            definicao:
              "Situação confusa, complicada ou embaraço difícil de resolver. Palavra de uso funcional recorrente no jornalismo político e em textos de opinião.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "cã/cãs",
            definicao:
              "Fio ou mecha de cabelo que se tornou branca devido à idade; o próprio cabelo branco. Termo de forte caráter literário e poético, raramente empregado na linguagem falada do dia a dia.",
          },
          {
            nivel: "Especializada",
            classe: "n4",
            palavra: "borla",
            definicao:
              "Enfeite pendente de fios de seda ou lã; ornamento circular de metal ou o barrete acadêmico. Termo especializado da moda, decoração ou ambiente universitário.",
          },
          {
            nivel: "Cotidiana",
            classe: "n2",
            palavra: "impertinente",
            definicao:
              "Que incomoda, é inconveniente ou atrevido. Palavra amplamente usada no cotidiano para qualificar comportamentos ou pessoas chatas.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "imolar",
            definicao:
              "Oferecer em sacrifício; matar em honra a uma divindade ou sacrificar-se por uma causa. Palavra muito presente na literatura e em textos históricos ou religiosos.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "exortar",
            definicao:
              "Incentivar, encorajar ou persuadir firmemente alguém a fazer algo. Comum em discursos públicos, textos jornalísticos, religiosos ou oficiais.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "tresnoitado",
            definicao:
              "Que passou a noite em claro; que não dormiu. Embora descreva uma situação comum (insônia), o adjetivo em si tem uso predominantemente literário.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "setentrional",
            definicao:
              "Que está situado ao norte; boreal. Termo recorrente em jornais, livros didáticos e documentos oficiais para delimitar regiões geográficas ao norte.",
          },
          {
            nivel: "Rara",
            classe: "n6",
            palavra: "voraginoso",
            definicao:
              "Que tem o caráter de voragem; que turbilhona, engole ou destrói. Termo raríssimo, de uso quase exclusivo em dicionários ou textos poéticos muito específicos.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "pertinaz",
            definicao:
              "Obstinado, teimoso ou que dura muito tempo (como uma doença). Termo formal e literário, usado para dar ênfase à persistência de algo.",
          },
          {
            nivel: "Cotidiana",
            classe: "n2",
            palavra: "alento",
            definicao:
              "Sopro de vida, coragem, ânimo ou vigor. Palavra comum no dia a dia para expressar conforto ou a força necessária para continuar algo.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "tenaz",
            definicao:
              "Que adere fortemente; persistentente, obstinado ou firme. Embora usado para descrever firmeza de caráter, seu uso atual é predominantemente literário e formal.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "pertinente",
            definicao:
              "Que é apropriado, relevante ou que diz respeito ao assunto. Muito comum em contratos, debates acadêmicos, jornais e no ambiente corporativo.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "glauca",
            definicao:
              "De cor verde-azulada ou esverdeada, como o mar. Adjetivo cromático muito específico, de circulação essencialmente literária e poética.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "austral",
            definicao:
              "Relativo ou pertencente ao sul; meridional. Frequentemente utilizado em contextos geográficos, jornalísticos e científicos para designar o hemisfério sul.",
          },
          {
            nivel: "Cotidiana",
            classe: "n2",
            palavra: "chapéu-coco",
            definicao:
              "Tipo de chapéu masculino de feltro, rígido e com a copa redonda (estilo Charlie Chaplin). Contexto social mínimo ligado à moda ou história.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "cálido",
            definicao:
              'Que é muito quente, ardente ou caloroso. Embora compreendido por proximidade com "calor", seu uso como adjetivo é majoritariamente literário.',
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "complacência",
            definicao:
              "Disposição para agradar, condescendência ou tolerância excessiva. Termo funcional com presença regular em análises comportamentais, jornais e contratos.",
          },
          {
            nivel: "Especializada",
            classe: "n4",
            palavra: "preemptório",
            definicao:
              'Variação de "peremptório". No âmbito jurídico, refere-se ao que extingue um direito ou prazo. Termo especializado de circulação restrita ao direito.',
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "enleio",
            definicao:
              "Estado de hesitação, encantamento, embaraço ou timidez. Vocábulo elegante e refinado, restrito a textos literários e poesias.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "boreal",
            definicao:
              'Relativo ao norte; setentrional. Muito comum na expressão "aurora boreal", aparece com regularidade em textos geográficos e de divulgação científica.',
          },
          {
            nivel: "Universal",
            classe: "n1",
            palavra: "água",
            definicao:
              "Substância líquida, incolor e inodora, essencial à vida. H₂O.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "obsequioso",
            definicao:
              "Que demonstra desvelo, cortesia excessiva ou disposição para agradar (obsequiar). Palavra de caráter predominantemente formal, literário ou burocrático.",
          },
          {
            nivel: "Especializada",
            classe: "n4",
            palavra: "comissura",
            definicao:
              "Ponto de união entre duas partes (como os cantos da boca ou conexões cerebrais). Termo técnico e especializado da anatomia e medicina.",
          },
          {
            nivel: "Cotidiana",
            classe: "n2",
            palavra: "acalanto",
            definicao:
              "Cantiga para ninar crianças; ato de consolar ou aquietar. Termo cotidiano ligado ao universo familiar e afetivo.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "onírico",
            definicao:
              "Relativo ou pertencente aos sonhos. Palavra ausente na fala cotidiana, mas frequente na literatura, crítica de arte e psicologia para descrever ambientes ou imagens de caráter fantástico ou surreal.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "mofa",
            definicao:
              "Ato de zombar, escarnecer ou ridicularizar algo ou alguém. Palavra que caiu em desuso na fala cotidiana, sobrevivendo em textos literários.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "meridional",
            definicao:
              "Relativo ao sul; austral. Palavra funcional usada com regularidade em contextos geográficos, jornalísticos e históricos para designar o que fica ao sul.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "diletante",

          {
            nivel: "Literária",
            classe: "n5",
            palavra: "empertigar",

          },
          {
            nivel: "Cotidiana",
            classe: "n2",
            palavra: "asco",
            definicao:
              "Sensação de repúdio, nojo ou forte aversão física ou moral. Palavra de uso cotidiano para expressar forte contrariedade ou repulsa em relação a algo ou alguém.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "malferido",
            definicao:
              "Gravemente ferido ou machucado. Adjetivo dramático e formal, muito utilizado em narrativas literárias e crônicas históricas.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "malaio",
            definicao:
              "Relativo à Malásia, ao seu povo ou ao seu idioma. Gentílico e termo linguístico que aparece com regularidade em jornais e textos geográficos.",
          },
          {
            nivel: "Rara",
            classe: "n6",
            palavra: "facúndia",
            definicao:
              "Facilidade no falar; eloquência ou loquacidade. Palavra raríssima, de pouca circulação fora de dicionários e textos literários muito antigos.",
          },
          {
            nivel: "Literária",
            classe: "n5",
            palavra: "estival",
            definicao:
              "Pertencente ou relativo ao verão. Do latim aestivalis, descreve o que ocorre ou é próprio dessa estação, sendo um termo predominantemente literário e formal.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "empirismo",
            definicao:
              "Doutrina filosófica que enfatiza o papel da experiência e da percepção sensorial no conhecimento. Termo funcional, comum em debates acadêmicos, jornais e livros didáticos.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "pragmatismo",
            definicao:
              "Doutrina ou comportamento que prioriza o valor prático, a utilidade e a eficácia das ações. Muito usado em análises políticas, editoriais e no meio corporativo.",
          },
          {
            nivel: "Funcional",
            classe: "n3",
            palavra: "misandria",
            definicao:
              "Aversão, desprezo ou ódio direcionado aos homens ou ao sexo masculino. Palavra funcional recorrente em debates sociológicos contemporâneos, jornais e redes sociais.",
          },
          {
            nivel: "Funcional",
            classe: "n3",

        if (!isNaN(val) && val >= 1) {
          QUIZ_SIZE = val;
          if (currentMode === "quiz") renderCards();
        } else {
          sizeInput.value = QUIZ_SIZE;
        }
      });

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".lang-btn").forEach((btn) => {
          btn.classList.toggle(
            "active",
            btn.textContent.toLowerCase() === lang,
          );
        });
        document.getElementById("subtitle").textContent = subtitles[lang];
        renderCards();
      }

      function setMode(mode) {
        currentMode = mode;
        document
          .getElementById("btn-all")
          .classList.toggle("active", mode === "all");
        document
          .getElementById("btn-quiz")
          .classList.toggle("active", mode === "quiz");
        renderCards();
      }

      function openPlay() {
        const pool = shuffle(db[currentLang]);
        const words = pool.slice(0, 20); // send up to 20; crossword will use what it can place
        const payload = encodeURIComponent(
          JSON.stringify({ lang: currentLang, words }),
        );
        window.open(`play.html#${payload}`, "_blank");
      }

      function renderCards() {
        const container = document.getElementById("cards");
        container.innerHTML = "";

        let lista = db[currentLang];
        if (currentMode === "quiz") {
          lista = shuffle(lista).slice(0, QUIZ_SIZE);
        }

        lista.forEach((d) => {
          const wrap = document.createElement("div");
          wrap.className = `card-wrap ${d.classe}`;
          wrap.innerHTML = `
          <div class="card">
            <div class="face front">
              <span class="nivel">${d.nivel}</span>
              <span class="palavra">${d.palavra}</span>
            </div>
            <div class="face back">
              <span class="nivel-back">${d.nivel}</span>
              <p class="definicao">${d.definicao}</p>
            </div>
          </div>
        `;
          wrap.addEventListener("click", () => {
            wrap.querySelector(".card").classList.toggle("flipped");
          });
          container.appendChild(wrap);
        });
      }
