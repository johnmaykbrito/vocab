<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards — Vocabulário</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #f5f3ee;
      color: #1a1a18;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #3a3a38;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #888780;
      margin-bottom: 1.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1rem;
    }

    .lang-btn {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 99px;
      border: 1px solid rgba(0,0,0,0.15);
      background: transparent;
      color: #888780;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover { border-color: rgba(0,0,0,0.3); color: #3a3a38; }

    .lang-btn.active {
      background: #1a1a18;
      color: #f5f3ee;
      border-color: #1a1a18;
    }

    .quiz-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 3rem;
    }

    .quiz-btn {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 99px;
      border: 1px solid rgba(0,0,0,0.15);
      background: transparent;
      color: #888780;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quiz-btn:hover { border-color: rgba(0,0,0,0.3); color: #3a3a38; }

    .quiz-btn.active {
      background: #888780;
      color: #f5f3ee;
      border-color: #888780;
    }

    .quiz-btn#btn-all.active {
      background: #1a1a18;
      color: #f5f3ee;
      border-color: #1a1a18;
    }

    .quiz-size-input {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      width: 44px;
      text-align: center;
      padding: 5px 6px;
      border-radius: 99px;
      border: 1px solid rgba(0,0,0,0.15);
      background: transparent;
      color: #888780;
      outline: none;
      transition: all 0.2s ease;
      -moz-appearance: textfield;
    }

    .quiz-size-input::-webkit-outer-spin-button,
    .quiz-size-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .quiz-size-input:focus {
      border-color: rgba(0,0,0,0.35);
      color: #3a3a38;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .card-wrap {
      perspective: 900px;
      height: 210px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(.4,0,.2,1);
    }

    .card-wrap:hover .card:not(.flipped) { transform: rotateY(6deg); }
    .card.flipped { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.4rem;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 1px solid rgba(0,0,0,0.08);
    }

    .front { background: #ffffff; }
    .back  { background: #f0ede6; transform: rotateY(180deg); }

    .nivel {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 700;
    }

    .palavra {
      font-size: 24px;
      font-weight: 400;
      color: #1a1a18;
      text-align: center;
      font-style: italic;
    }

    .nivel-back {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .definicao {
      font-size: 13px;
      color: #444441;
      text-align: center;
      line-height: 1.65;
    }

    .n1 .nivel      { background: #E1F5EE; color: #0F6E56; }
    .n1 .nivel-back { color: #0F6E56; }
    .n2 .nivel      { background: #E6F1FB; color: #185FA5; }
    .n2 .nivel-back { color: #185FA5; }
    .n3 .nivel      { background: #FAEEDA; color: #854F0B; }
    .n3 .nivel-back { color: #854F0B; }
    .n4 .nivel      { background: #EEEDFE; color: #534AB7; }
    .n4 .nivel-back { color: #534AB7; }
    .n5 .nivel      { background: #FAECE7; color: #993C1D; }
    .n5 .nivel-back { color: #993C1D; }
    .n6 .nivel      { background: #ebebeb; color: #5F5E5A; }
    .n6 .nivel-back { color: #5F5E5A; }

    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1c; color: #e8e6e0; }
      h1 { color: #c8c6c0; }
      .front { background: #2a2a28; }
      .back  { background: #242422; }
      .face  { border-color: rgba(255,255,255,0.07); }
      .palavra  { color: #e8e6e0; }
      .definicao { color: #b4b2a9; }

      .lang-btn { border-color: rgba(255,255,255,0.15); color: #888780; }
      .lang-btn:hover { border-color: rgba(255,255,255,0.35); color: #c8c6c0; }
      .lang-btn.active { background: #e8e6e0; color: #1a1a18; border-color: #e8e6e0; }

      .quiz-btn { border-color: rgba(255,255,255,0.15); color: #888780; }
      .quiz-btn:hover { border-color: rgba(255,255,255,0.35); color: #c8c6c0; }
      .quiz-btn.active { background: #888780; color: #1a1a18; border-color: #888780; }
      .quiz-btn#btn-all.active { background: #e8e6e0; color: #1a1a18; border-color: #e8e6e0; }

      .quiz-size-input { border-color: rgba(255,255,255,0.15); color: #888780; }
      .quiz-size-input:focus { border-color: rgba(255,255,255,0.35); color: #c8c6c0; }

      .n1 .nivel      { background: #085041; color: #9FE1CB; }
      .n1 .nivel-back { color: #9FE1CB; }
      .n2 .nivel      { background: #0C447C; color: #B5D4F4; }
      .n2 .nivel-back { color: #B5D4F4; }
      .n3 .nivel      { background: #633806; color: #FAC775; }
      .n3 .nivel-back { color: #FAC775; }
      .n4 .nivel      { background: #3C3489; color: #CECBF6; }
      .n4 .nivel-back { color: #CECBF6; }
      .n5 .nivel      { background: #712B13; color: #F5C4B3; }
      .n5 .nivel-back { color: #F5C4B3; }
      .n6 .nivel      { background: #333331; color: #D3D1C7; }
      .n6 .nivel-back { color: #D3D1C7; }
    }
  </style>
</head>
<body>

  <h1>Flashcards de Vocabulário</h1>
  <p class="subtitle" id="subtitle">Português Brasileiro · por frequência de exposição</p>

  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('fr')">FR</button>
  </div>

  <div class="quiz-controls">
    <button class="quiz-btn active" id="btn-all" onclick="setMode('all')">Todos</button>
    <button class="quiz-btn" id="btn-quiz" onclick="setMode('quiz')">Sortear</button>
    <input type="number" id="quiz-size-input" class="quiz-size-input" min="1" value="3" title="Quantidade de cards sorteados" />
  </div>

  <div class="grid" id="cards"></div>

  <script>
    /* ─── CONFIGURAÇÃO ─────────────────────────────────────────────────────
       QUIZ_SIZE define o valor inicial do sorteio.
       Pode ser alterado aqui ou diretamente pelo campo numérico na tela.
    ─────────────────────────────────────────────────────────────────────── */
    let QUIZ_SIZE = 3;

    /* ─── DADOS ────────────────────────────────────────────────────────────
       Adicione palavras livremente em cada lista.
       Cada entrada: { nivel, classe (n1–n6), palavra, definicao }
       As listas são independentes — não são traduções entre si.
    ─────────────────────────────────────────────────────────────────────── */
    const db = {

      pt: [
        { nivel: "Universal",     classe: "n1", palavra: "água",
          definicao: "Substância líquida, incolor e inodora, essencial à vida. H₂O." },
        { nivel: "Cotidiana",     classe: "n2", palavra: "asco",
          definicao: "Sensação de repúdio, nojo ou forte aversão física ou moral. Palavra de uso cotidiano para expressar forte contrariedade ou repulsa em relação a algo ou alguém." },
        { nivel: "Funcional",     classe: "n3", palavra: "austral",
          definicao: "Relativo ou pertencente ao sul; meridional. Frequentemente utilizado em contextos geográficos, jornalísticos e científicos para designar o hemisfério sul." },
        { nivel: "Funcional",     classe: "n3", palavra: "boreal",
          definicao: "Relativo ao norte; setentrional. Muito comum na expressão \"aurora boreal\", aparece com regularidade em textos geográficos e de divulgação científica." },
        { nivel: "Funcional",     classe: "n3", palavra: "setentrional",
          definicao: "Que está situado ao norte; boreal. Termo recorrente em jornais, livros didáticos e documentos oficiais para delimitar regiões geográficas ao norte." },
        { nivel: "Funcional",     classe: "n3", palavra: "meridional",
          definicao: "Relativo ao sul; austral. Palavra funcional usada com regularidade em contextos geográficos, jornalísticos e históricos para designar o que fica ao sul." },
        { nivel: "Funcional",     classe: "n3", palavra: "desincumbir",
          definicao: "Desobrigar-se de um dever, tarefa ou encargo; cumprir uma obrigação. Palavra comum em contratos, correspondências profissionais e textos jornalísticos." },
        { nivel: "Funcional",     classe: "n3", palavra: "complacência",
          definicao: "Disposição para agradar, condescendência ou tolerância excessiva. Termo funcional com presença regular em análises comportamentais, jornais e contratos." },
        { nivel: "Especializada", classe: "n4", palavra: "subsunção",
          definicao: "Ato de incluir um caso concreto sob uma norma jurídica geral; enquadramento legal." },
        { nivel: "Literária",     classe: "n5", palavra: "onírico",
          definicao: "Relativo ou pertencente aos sonhos. Palavra ausente na fala cotidiana, mas frequente na literatura, crítica de arte e psicologia para descrever ambientes ou imagens de caráter fantástico ou surreal." },
        { nivel: "Literária",     classe: "n5", palavra: "estival",
          definicao: "Pertencente ou relativo ao verão. Do latim aestivalis, descreve o que ocorre ou é próprio dessa estação, sendo um termo predominantemente literário e formal." },
        { nivel: "Literária",     classe: "n5", palavra: "obsequioso",
          definicao: "Que demonstra desvelo, cortesia excessiva ou disposição para agradar (obsequiar). Palavra de caráter predominantemente formal, literário ou burocrático." },
        { nivel: "Literária",     classe: "n5", palavra: "tenaz",
          definicao: "Que adere fortemente; persistente, obstinado ou firme. Embora usado para descrever firmeza de caráter, seu uso atual é predominantemente literário e formal." },
        { nivel: "Rara",          classe: "n6", palavra: "voraginoso",
          definicao: "Que tem o caráter de voragem; que turbilhona, engole ou destrói. Termo raríssimo, de uso quase exclusivo em dicionários ou textos poéticos muito específicos." }
      ],

      en: [
        { nivel: "Universal",   classe: "n1", palavra: "water",
          definicao: "A transparent, odourless liquid essential to all known life. H₂O." },
        { nivel: "Everyday",    classe: "n2", palavra: "mortgage",
          definicao: "A loan secured against a property, repaid with interest over an agreed period." },
        { nivel: "Functional",  classe: "n3", palavra: "liability",
          definicao: "A legal obligation or debt for which a person or entity is responsible." },
        { nivel: "Functional",  classe: "n3", palavra: "badonkadonk",
          definicao: "Slang for a large, round buttocks. Popularised by country music and hip-hop in the 2000s; widely understood, occasionally used humorously." },
        { nivel: "Specialised", classe: "n4", palavra: "tort",
          definicao: "A civil wrong that causes harm, giving rise to legal liability independent of contract." },
        { nivel: "Literary",    classe: "n5", palavra: "susurrus",
          definicao: "A soft murmuring or whispering sound; a gentle, continuous rustle." },
        { nivel: "Literary",    classe: "n5", palavra: "lest",
          definicao: "Conjunction meaning \"for fear that.\" Rare in speech; survives in formal writing, legal texts, and literature (\"lest we forget\")." },
        { nivel: "Rare",        classe: "n6", palavra: "defenestrate",
          definicao: "To throw someone or something out of a window; historically used in political contexts." }
      ],

      fr: [
        { nivel: "Universel",   classe: "n1", palavra: "eau",
          definicao: "Substance liquide, incolore et inodore, indispensable à toute forme de vie. H₂O." },
        { nivel: "Universel",   classe: "n1", palavra: "chemin",
          definicao: "Voie permettant d'aller d'un lieu à un autre; aussi employé au figuré. Connu de tous les francophones." },
        { nivel: "Quotidien",   classe: "n2", palavra: "loyer",
          definicao: "Somme versée périodiquement par un locataire à son propriétaire en échange d'un logement." },
        { nivel: "Fonctionnel", classe: "n3", palavra: "insolvabilité",
          definicao: "État d'une personne ou d'une entreprise incapable de faire face à ses dettes." },
        { nivel: "Spécialisé",  classe: "n4", palavra: "jurisprudence",
          definicao: "Ensemble des décisions de justice qui font autorité et guident l'interprétation du droit." },
        { nivel: "Littéraire",  classe: "n5", palavra: "ineffable",
          definicao: "Ce qui ne peut être exprimé par des mots; indicible, au-delà du langage." },
        { nivel: "Rare",        classe: "n6", palavra: "mirmillon",
          definicao: "Gladiateur romain armé d'un casque à aileron, d'un bouclier et d'un glaive." }
      ]

    };

    const subtitles = {
      pt: "Português Brasileiro · por frequência de exposição",
      en: "English · by frequency of exposure",
      fr: "Français · par fréquence d'exposition"
    };

    let currentLang = 'pt';
    let currentMode = 'all';

    const sizeInput = document.getElementById('quiz-size-input');

    sizeInput.addEventListener('change', () => {
      const val = parseInt(sizeInput.value, 10);
      if (!isNaN(val) && val >= 1) {
        QUIZ_SIZE = val;
        if (currentMode === 'quiz') renderCards();
      } else {
        sizeInput.value = QUIZ_SIZE;
      }
    });

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
      });
      document.getElementById('subtitle').textContent = subtitles[lang];
      renderCards();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-all').classList.toggle('active', mode === 'all');
      document.getElementById('btn-quiz').classList.toggle('active', mode === 'quiz');
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards');
      container.innerHTML = '';

      let lista = db[currentLang];
      if (currentMode === 'quiz') {
        lista = shuffle(lista).slice(0, QUIZ_SIZE);
      }

      lista.forEach(d => {
        const wrap = document.createElement('div');
        wrap.className = `card-wrap ${d.classe}`;
        wrap.innerHTML = `
          <div class="card">
            <div class="face front">
              <span class="nivel">${d.nivel}</span>
              <span class="palavra">${d.palavra}</span>
            </div>
            <div class="face back">
              <span class="nivel-back">${d.nivel}</span>
              <p class="definicao">${d.definicao}</p>
            </div>
          </div>
        `;
        wrap.addEventListener('click', () => {
          wrap.querySelector('.card').classList.toggle('flipped');
        });
        container.appendChild(wrap);
      });
    }

    renderCards();
  </script>

</body>
</html>
